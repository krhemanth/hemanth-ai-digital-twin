services:
  - type: web
    name: hemanth-ai-digital-twin
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: OPENAI_GUARD_MODEL
        value: gpt-5.4-nano
      - key: PUSHOVER_USER
        sync: false
      - key: PUSHOVER_TOKEN
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        value: hemanthdse@gmail.com
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_HUMAN_RECIPIENT
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v26.0
      - key: GMAIL_OAUTH_TOKEN_JSON
        sync: false
      - key: GMAIL_ALLOW_INTERACTIVE_OAUTH
        value: "false"
      - key: GRADIO_INBROWSER
        value: "false"
      - key: GRADIO_SHARE
        value: "false"
